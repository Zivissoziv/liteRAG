# 可选方案：用 Docker 跑 Qdrant（本地二进制见 tools/qdrant/）
# 数据落 ./data/qdrant，与 tools/qdrant/storage 互不影响
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: literag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
