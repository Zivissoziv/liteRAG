server:
  port: 8080
  compression:
    enabled: true

spring:
  application:
    name: literag
  # 默认数据库：SQLite（单文件，落盘 ./data/db/literag.db，停服务数据仍在）
  # 切 MySQL：--spring.profiles.active=mysql（详见 application-mysql.yml）
  datasource:
    # transaction_mode=IMMEDIATE 让写事务在 BEGIN 时就排队拿写锁，
    # 否则并发写入会抛 SQLITE_BUSY_SNAPSHOT（busy_timeout 对快照冲突无效）
    url: "jdbc:sqlite:./data/db/literag.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL&transaction_mode=IMMEDIATE"
    driver-class-name: org.sqlite.JDBC
    username: ''
    password: ''
    hikari:
      pool-name: literag-sqlite
      # SQLite 是单写者模型，连接数不宜过大；WAL + busy_timeout 让读写尽量互不阻塞
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        format_sql: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

literag:
  storage-dir: ./data/uploads
  vector:
    # qdrant（默认，连接本地或远端 Qdrant）| local（进程内余弦检索）| auto（Qdrant 不可用时回退本地）
    provider: qdrant
    qdrant:
      url: http://localhost:6333
      api-key: ''
      timeout: 20
  chunk:
    size: 800
    overlap: 120
  mcp:
    server-name: literag-knowledge
    server-version: 1.0.0
    api-key: ''
  cors:
    allowed-origins: '*'

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.literag: INFO
    org.apache.pdfbox: ERROR
    org.apache.poi: ERROR
